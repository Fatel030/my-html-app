<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蔡宗諭 詩集 | 數位紙張閱讀器</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Noto Serif TC & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Noto Serif TC"', 'serif'],
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        paper: {
                            50: '#FDFBF7',
                            100: '#FAF7F2',
                            200: '#F3EDE2',
                            300: '#E8DDCB',
                            800: '#3D3835',
                            900: '#2C2825',
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #FAF7F2;
            color: #2C2825;
            font-family: 'Noto Serif TC', serif;
        }

        /* 米紙材質微壓紋效果 */
        .paper-texture {
            background-color: #FDFBF7;
            box-shadow: 0 20px 40px -15px rgba(61, 56, 53, 0.07), 0 0 0 1px rgba(232, 221, 203, 0.5);
        }

        .poem-line {
            line-height: 2.2;
            letter-spacing: 0.05em;
        }

        /* 自訂滾動條 */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #FAF7F2;
        }
        ::-webkit-scrollbar-thumb {
            background: #E8DDCB;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #C4B59D;
        }

        .page-transition {
            transition: opacity 0.25s ease-in-out, transform 0.25s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-stone-200 selection:text-stone-900">

    <!-- 頂部功能列 -->
    <header class="w-full max-w-4xl mx-auto px-6 py-6 flex justify-between items-center border-b border-paper-300/60">
        <a href="index.html" class="flex items-center space-x-2 text-stone-600 hover:text-stone-900 transition-colors text-sm font-sans">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
            </svg>
            <span>返回個人網站</span>
        </a>
        
        <div class="flex items-center space-x-6 text-sm">
            <button onclick="goToPage(0)" class="text-stone-600 hover:text-stone-900 transition-colors">封面</button>
            <button onclick="goToPage(1)" class="text-stone-600 hover:text-stone-900 transition-colors">序言</button>
            <button onclick="goToPage(2)" class="text-stone-600 hover:text-stone-900 transition-colors">目錄</button>
            <a href="https://www.instagram.com/fake.ice.8/" target="_blank" rel="noopener noreferrer" class="text-amber-700 hover:text-amber-900 font-medium flex items-center space-x-1">
                <span>Instagram</span>
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                </svg>
            </a>
        </div>
    </header>

    <!-- 主要閱讀卡片區域 -->
    <main class="flex-1 max-w-3xl w-full mx-auto my-6 px-4 flex flex-col justify-center">
        <div id="book-container" class="paper-texture rounded-2xl p-8 sm:p-14 md:p-16 min-h-[600px] flex flex-col justify-between relative overflow-hidden page-transition">
            
            <!-- 動態渲染頁面內容區 -->
            <div id="page-content" class="w-full flex-1">
                <!-- 由 JavaScript 載入 -->
                <div class="flex justify-center items-center h-64 text-stone-400 font-sans">
                    <span>載入詩集中...</span>
                </div>
            </div>

            <!-- 頁碼與翻頁控制 -->
            <footer id="book-footer" class="mt-12 pt-6 border-t border-paper-200/80 flex justify-between items-center text-xs font-sans text-stone-500">
                <button id="btn-prev" onclick="prevPage()" class="flex items-center space-x-1 hover:text-stone-900 disabled:opacity-30 disabled:hover:text-stone-500 transition-colors px-2 py-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 19l-7-7 7-7"/></svg>
                    <span>上一頁</span>
                </button>
                
                <span id="page-indicator" class="tracking-widest font-mono text-stone-400">PAGE 1 / --</span>

                <button id="btn-next" onclick="nextPage()" class="flex items-center space-x-1 hover:text-stone-900 disabled:opacity-30 disabled:hover:text-stone-500 transition-colors px-2 py-1">
                    <span>下一頁</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5l7 7-7 7"/></svg>
                </button>
            </footer>

        </div>
    </main>

    <!-- 頁腳提示 -->
    <footer class="w-full py-4 text-center text-xs text-stone-400 font-sans">
        <p>提示：可使用鍵盤左右方向鍵 <kbd class="px-1.5 py-0.5 bg-stone-200/60 rounded text-stone-600">←</kbd> <kbd class="px-1.5 py-0.5 bg-stone-200/60 rounded text-stone-600">→</kbd> 進行翻頁</p>
    </footer>

    <!-- JavaScript 腳本 -->
    <script>
        let poetryData = null;
        let pages = []; // 全部頁面清單：[Cover, Preface, TOC, Poem1, Poem2...]
        let currentPageIndex = 0;

        // 初始化載入 JSON
        async function initPoetryBook() {
            try {
                const res = await fetch('poems.json');
                poetryData = await res.json();
                buildPages();
                renderPage(0);
            } catch (err) {
                console.error("Failed to load poetry data:", err);
                document.getElementById('page-content').innerHTML = `
                    <div class="text-center py-12 text-rose-700 font-sans">
                        <p class="font-bold text-lg mb-2">無法載入詩集資料</p>
                        <p class="text-sm text-stone-500">請確認 poems.json 是否存在。</p>
                    </div>
                `;
            }
        }

        // 建構頁面清單
        function buildPages() {
            pages = [];

            // 0: 封面 Cover
            pages.push({ type: 'cover' });

            // 1: 序言 / 作者簡介 Preface
            pages.push({ type: 'preface' });

            // 2: 目錄 Table of Contents
            pages.push({ type: 'toc' });

            // 3~N: 各首詩 Poem pages
            poetryData.poems.forEach((poem, idx) => {
                pages.push({
                    type: 'poem',
                    data: poem,
                    indexInBook: idx + 1
                });
            });
        }

        // 渲染特定頁面
        function renderPage(index) {
            if (index < 0 || index >= pages.length) return;

            const container = document.getElementById('page-content');
            const page = pages[index];
            currentPageIndex = index;

            // 淡入動畫
            container.style.opacity = 0;
            
            setTimeout(() => {
                let html = '';

                if (page.type === 'cover') {
                    html = `
                        <div class="flex flex-col justify-between items-center text-center py-12 min-h-[420px]">
                            <div class="space-y-4 my-auto">
                                <div class="text-xs tracking-[0.3em] text-stone-400 font-sans uppercase mb-6">Poetry Collection</div>
                                <h1 class="text-4xl sm:text-5xl font-bold tracking-widest text-paper-900 mb-4">${poetryData.metadata.title}</h1>
                                <p class="text-stone-500 tracking-widest text-base font-light">蔡宗諭 著</p>
                            </div>
                            <div class="mt-12">
                                <button onclick="goToPage(1)" class="px-8 py-3 bg-paper-800 text-paper-50 rounded-full hover:bg-paper-900 transition-all font-sans text-sm tracking-wider shadow-md hover:shadow-lg transform hover:-translate-y-0.5">
                                    翻開詩集
                                </button>
                            </div>
                        </div>
                    `;
                } 
                else if (page.type === 'preface') {
                    html = `
                        <div class="py-4 space-y-8">
                            <div class="border-b border-paper-300/80 pb-4 text-center">
                                <h2 class="text-2xl font-bold tracking-widest text-paper-900">序言 ‧ 關於作者</h2>
                            </div>
                            
                            <div class="space-y-6 text-stone-700 leading-loose text-base font-light">
                                <p class="indent-8">${poetryData.metadata.preface}</p>
                            </div>

                            <div class="pt-6 border-t border-paper-200/80">
                                <h3 class="text-sm font-bold text-stone-800 mb-2 font-sans">作者簡介</h3>
                                <p class="text-sm text-stone-600 leading-relaxed font-light">${poetryData.metadata.bio}</p>
                            </div>

                            <div class="text-center pt-4">
                                <button onclick="goToPage(2)" class="px-6 py-2 border border-paper-800 text-paper-800 rounded-full hover:bg-paper-800 hover:text-paper-50 transition-all font-sans text-xs tracking-wider">
                                    查看目錄
                                </button>
                            </div>
                        </div>
                    `;
                } 
                else if (page.type === 'toc') {
                    // 目錄頁
                    let volumesHtml = '';
                    poetryData.volumes.forEach(vol => {
                        const volPoems = poetryData.poems.filter(p => p.volume_id === vol.id);
                        if (volPoems.length === 0) return;

                        let poemListHtml = '';
                        volPoems.forEach(p => {
                            // 找到該詩在 pages 陣列中的索引
                            const pageIdx = pages.findIndex(pg => pg.type === 'poem' && pg.data.id === p.id);
                            poemListHtml += `
                                <li class="flex justify-between items-baseline group cursor-pointer py-1.5" onclick="goToPage(${pageIdx})">
                                    <span class="text-stone-700 group-hover:text-amber-800 group-hover:underline font-light transition-colors">${p.title}</span>
                                    <span class="border-b border-dots flex-1 mx-3 border-stone-300/60 border-dotted"></span>
                                    <span class="text-xs font-mono text-stone-400 group-hover:text-amber-800">P. ${pageIdx + 1}</span>
                                </li>
                            `;
                        });

                        volumesHtml += `
                            <div class="mb-8">
                                <div class="mb-3 pb-1 border-b border-paper-300 flex justify-between items-baseline">
                                    <h3 class="font-bold text-lg text-paper-900 tracking-wider">${vol.name}</h3>
                                    <span class="text-xs text-stone-400 font-sans">${vol.desc}</span>
                                </div>
                                <ul class="space-y-1 text-sm">
                                    ${poemListHtml}
                                </ul>
                            </div>
                        `;
                    });

                    html = `
                        <div class="py-2">
                            <div class="text-center mb-8">
                                <h2 class="text-2xl font-bold tracking-widest text-paper-900">詩集目錄</h2>
                                <p class="text-xs text-stone-400 font-sans mt-1">收錄 ${poetryData.metadata.total_poems} 首詩作</p>
                            </div>
                            <div class="space-y-6">
                                ${volumesHtml}
                            </div>
                        </div>
                    `;
                } 
                else if (page.type === 'poem') {
                    const poem = page.data;
                    const vol = poetryData.volumes.find(v => v.id === poem.volume_id);
                    const volName = vol ? vol.name : '';

                    let poemBodyHtml = '';
                    if (poem.stanzas && poem.stanzas.length > 0) {
                        poemBodyHtml = poem.stanzas.map(stanza => {
                            const stanzaLines = stanza.map(line => `<p class="poem-line text-stone-800 text-base md:text-lg">${line}</p>`).join('');
                            return `<div class="stanza mb-6 space-y-1">${stanzaLines}</div>`;
                        }).join('');
                    } else if (poem.lines) {
                        poemBodyHtml = poem.lines.map(line => `<p class="poem-line text-stone-800 text-base md:text-lg">${line}</p>`).join('');
                    }

                    html = `
                        <div class="py-2 min-h-[480px] flex flex-col justify-between">
                            <div>
                                <!-- 分輯頂部標籤 -->
                                <div class="flex justify-between items-center text-xs text-stone-400 font-sans mb-8 pb-3 border-b border-paper-200/80">
                                    <span class="tracking-wider text-amber-800/80">${volName}</span>
                                    <button onclick="goToPage(2)" class="hover:text-stone-800 transition-colors">回目錄</button>
                                </div>

                                <!-- 詩歌標題 -->
                                <h2 class="text-2xl sm:text-3xl font-bold tracking-widest text-paper-900 mb-8">${poem.title}</h2>

                                <!-- 詩歌內文 -->
                                <div class="pl-1 md:pl-2 font-serif font-normal">
                                    ${poemBodyHtml}
                                </div>
                            </div>

                            ${poem.source ? `
                                <div class="mt-12 pt-4 text-right text-[11px] font-sans text-stone-400">
                                    <span>收錄自：${poem.source.split('\\')[0]}</span>
                                </div>
                            ` : ''}
                        </div>
                    `;
                }

                container.innerHTML = html;
                container.style.opacity = 1;
                updateFooterUI();
            }, 150);
        }

        // 更新頁碼指示器與按鈕狀態
        function updateFooterUI() {
            const pageIndicator = document.getElementById('page-indicator');
            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');

            pageIndicator.textContent = `PAGE ${currentPageIndex + 1} / ${pages.length}`;
            btnPrev.disabled = (currentPageIndex === 0);
            btnNext.disabled = (currentPageIndex === pages.length - 1);
        }

        // 翻頁函式
        function goToPage(index) {
            if (index >= 0 && index < pages.length) {
                renderPage(index);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function nextPage() {
            if (currentPageIndex < pages.length - 1) {
                goToPage(currentPageIndex + 1);
            }
        }

        function prevPage() {
            if (currentPageIndex > 0) {
                goToPage(currentPageIndex - 1);
            }
        }

        // 鍵盤翻頁監聽
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'PageDown') {
                nextPage();
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                prevPage();
            }
        });

        // 啟動
        document.addEventListener('DOMContentLoaded', initPoetryBook);
    </script>
</body>
</html>
